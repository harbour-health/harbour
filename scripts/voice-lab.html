<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice lab</title>
<style>
:root{font:16px -apple-system,BlinkMacSystemFont,sans-serif;color:#181818;background:#f7f7f5;color-scheme:light dark}*{box-sizing:border-box}body{max-width:1120px;margin:auto;padding:52px 28px}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:32px}h1{font-size:32px;letter-spacing:-1px;margin:0}header span,.meta,small{color:#73736f;font-size:13px}.editor{background:white;border:1px solid #dededb;border-radius:24px;padding:20px;margin-bottom:24px}textarea{font:inherit;line-height:1.6;resize:vertical;width:100%;min-height:130px;border:0;outline:none;background:transparent;color:inherit}label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}.models{display:grid;grid-template-columns:1fr 1fr;gap:20px}.model{background:white;border:1px solid #dededb;border-radius:24px;padding:24px;min-width:0}h2{font-size:24px;letter-spacing:-.5px;margin:0 0 5px}.meta{margin-bottom:28px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}select{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1px solid #d7d7d2;color:inherit;background:transparent}input[type=range]{width:100%;accent-color:#202020;height:24px}.wide{grid-column:1/-1}.value{float:right;font-weight:400;color:#73736f}button{cursor:pointer;border:0;border-radius:24px;padding:13px 20px;font:600 15px -apple-system,BlinkMacSystemFont,sans-serif;background:#181818;color:#fff;min-height:46px}button:disabled{opacity:.4;cursor:wait}.secondary{background:#eee;color:#181818}.result{margin-top:20px}.status{font-size:14px;min-height:20px;margin:16px 0;color:#73736f}audio{width:100%;margin-bottom:12px}small{display:block;line-height:1.5;margin-top:24px}.history{margin-top:40px}h3{font-size:17px}.take{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid #ddd;padding:14px 0}.take audio{max-width:380px;margin:0}.take span{font-size:14px}button:hover{opacity:.8}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #92a9e0;outline-offset:3px}@media(max-width:700px){body{padding:28px 18px}.models{grid-template-columns:1fr}.take{flex-direction:column;align-items:flex-start}header span{display:none}}@media(prefers-color-scheme:dark){:root{background:#151515;color:#f3f3f0}.editor,.model{background:#202020;border-color:#383838}select{border-color:#484848}button{background:#f4f4f0;color:#181818}.secondary{background:#343434;color:#eee}.take{border-color:#393939}input[type=range]{accent-color:white}}
</style>
<header><h1>Voice lab</h1><span>On this Mac · local inference</span></header>
<div class="editor"><label for="text">Sample text</label><textarea id="text" maxlength="2000">Hi, I'm Harbour. How are you feeling today? We can take things one step at a time. Your appointment is on Tuesday at three thirty. Does that sound right?</textarea></div>
<main class="models" id="models"></main><section class="history" hidden><h3>Previous samples</h3><div id="history"></div></section>
<script>
const token='__TOKEN__';
const $=s=>document.querySelector(s);
const post=async(path,data)=>{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Voice-Lab':token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v};
const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function setup(){const {models}=await(await fetch('/api/catalog')).json();for(const m of models){const card=document.createElement('section');card.className='model';card.innerHTML=`<h2>${m.name}</h2><div class="meta">${m.size}</div><div class="controls"><div><label for="${m.id}-language">Language</label><select id="${m.id}-language" class="language">${m.languages.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><div><label for="${m.id}-voice">Voice</label><select id="${m.id}-voice" class="voice"></select></div><div class="wide"><label for="${m.id}-speed">Speed <span class="value speed-value">1.00×</span></label><input id="${m.id}-speed" class="speed" type="range" min="0.6" max="1.5" step="0.05" value="1"></div>${m.id==='supertonic'?`<div class="wide"><label for="${m.id}-steps">Denoising steps <span class="value steps-value">8</span></label><input id="${m.id}-steps" class="steps" type="range" min="1" max="32" value="8"></div>`:''}</div><button class="generate">Generate sample</button><div class="status" role="status" aria-live="polite"></div><div class="result"></div><small>${m.note}</small>`;
$('#models').append(card);const find=s=>card.querySelector(s);function voices(){const lang=m.languages.find(l=>l.id===find('.language').value);const options=m.voices.filter(v=>!lang.prefixes||lang.prefixes.some(p=>v.startsWith(p))).sort((a,b)=>(m.preferredVoices?.includes(b)?1:0)-(m.preferredVoices?.includes(a)?1:0)||a.localeCompare(b));find('.voice').innerHTML=options.map(v=>`<option value="${v}">${v}${m.preferredVoices?.includes(v)?' ★':''}</option>`).join('');if(options.includes(m.defaultVoice))find('.voice').value=m.defaultVoice}voices();find('.language').onchange=voices;find('.speed').oninput=e=>find('.speed-value').textContent=Number(e.target.value).toFixed(2)+'×';if(find('.steps'))find('.steps').oninput=e=>find('.steps-value').textContent=e.target.value;
find('.generate').onclick=async()=>{const button=find('.generate'),status=find('.status');button.disabled=true;find('.result').replaceChildren();try{const request={model:m.id,text:$('#text').value,language:find('.language').value,voice:find('.voice').value,speed:Number(find('.speed').value),steps:Number(find('.steps')?.value||8)};status.textContent='Preparing…';const {id}=await post('/api/generate',request);let job;do{await new Promise(r=>setTimeout(r,500));job=await(await fetch('/api/jobs/'+id)).json();status.textContent=job.state==='queued'?'Waiting…':job.state==='generating'?'Generating on this Mac…':''}while(['queued','generating'].includes(job.state));if(job.state!=='ready')throw Error(job.error||'Generation failed');status.textContent=`${job.duration}s audio · generated in ${job.seconds}s`;const audio=document.createElement('audio');audio.controls=true;audio.src=job.audio;find('.result').append(audio);const play=document.createElement('button');play.className='secondary';play.textContent='Play on Mac';play.onclick=()=>post('/api/play',{job:id}).catch(e=>status.textContent=e.message);find('.result').append(play);const take=document.createElement('div');take.className='take';take.innerHTML=`<span>${m.name} · ${escapeText(request.voice)} · ${request.speed.toFixed(2)}×</span><audio controls src="${job.audio}"></audio>`;$('#history').prepend(take);$('.history').hidden=false;}catch(e){status.textContent=e.message}finally{button.disabled=false}};}}
setup().catch(e=>$('#models').textContent=e.message);
</script></html>
